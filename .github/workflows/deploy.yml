name: Deploy to GitHub Pages

# DISABLED (manual trigger only): this deployed irritrack_mobile/ (renamed
# DEPRECATED_irritrack_mobile/ — see its README), the old local-auth build,
# on every push. The production app now lives on Firebase Hosting and is
# deployed via `firebase deploy --only hosting` after the security
# hardening. Re-enable deliberately if GitHub Pages is still wanted — but
# note DEPRECATED_irritrack_mobile/ is unmaintained; check it still builds
# first.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: DEPRECATED_irritrack_mobile

    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.27.0'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build web
      run: flutter build web --release --base-href /irrigation-automated-flow/ --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./DEPRECATED_irritrack_mobile/build/web
